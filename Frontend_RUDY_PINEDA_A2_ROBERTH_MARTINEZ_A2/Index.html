<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<!--MENU-->

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary " data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Reservas</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/HTMl/Clientes.html">Clientes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/HTMl/Vehiculos.html">Vehiculos</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container pg-4">
      <!--Formurario-->
      <form id="FRMreservas">

        <input type="hidden" id="TXTreserva">

        <label>Clientes</label>
        <select class="form-select form-select-lg mb-3" aria-label="Large select example"  id="TXTclientes" required>
            <option selected>Elija una opcion</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>




          <label>Vehiculos</label>
        <select class="form-select form-select-lg mb-3" aria-label="Large select example"   id="TXTvehiculos" required>
            <option selected>Elija una opcion</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>

          <div class="mb-3">
            <label>Nombre de Reserva</label>
            <input type="text" class="form-control" id="TXTnombreReserva" max="30" min="5" required>
          </div>
          
          <div class="mb-3">
            <label>Fecha de Reserva</label>
            <input type="date" class="form-control" id="TMfechaReserva" required>
          </div>

          <div class="mb-3">
            <label>Catidad Pasajeros</label>
            <input type="number" class="form-control" id="NcantidadPasajeros" min="1"  required >
          </div>
  

          <div class="mb-3">
            <label>Cantidad de dias</label>
            <input type="number" class="form-control" id="NcantidadDias" max="365" min="1" required>
          </div>
          
          <label>Estado</label>
          <select class="form-select form-select-lg mb-3" aria-label="Large select example"  id="TXTestado" required>
            <option selected>Elija una opcion</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>

        <button type="submit" id="BTNsubir" class="btn btn-primary">Subir</button>
      </form>



      <!--Tabla-->

      <table id="TBtablaReserva" class="table" >
        <thead >
          <tr>
            <th scope="col">id</th>
            <th scope="col">Cliente</th>
            <th scope="col">Vehiculo</th>
            <th scope="col">Nombre reserva</th>
            <th scope="col">Fecha reserva</th>
            <th scope="col">Catidad de días</th>
            <th scope="col">Cantidad pasajeros</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
  
        </tbody>
      </table>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
